<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eade"><title>Dein Adventskalender</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap');
:root{--cream:#f5eade;--ink:#354636;--sage:#929b83;--rose:#bd7d72;--brick:#a65148;--sand:#d0a989}*{box-sizing:border-box}body{margin:0;color:#353d31;background:var(--cream);font-family:'DM Sans',system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(#b99f85 .6px,transparent .6px);background-size:18px 18px}.wrap{position:relative;max-width:780px;margin:auto;padding:36px 22px 70px}header{text-align:center;margin-bottom:27px}.eyebrow{font-size:.7rem;letter-spacing:.24em;font-weight:700}.script{font-family:'Caveat','Brush Script MT',cursive;font-weight:600}h1{font-size:clamp(3.4rem,10vw,5.5rem);line-height:.85;margin:13px 0 12px;font-weight:600}header p{font-size:.91rem;color:#756d61}.ornament{color:var(--brick);font-size:26px}.branch{position:absolute;top:10px;font-size:62px;opacity:.75;pointer-events:none}.branch.left{left:4px;transform:rotate(-25deg)}.branch.right{right:4px;transform:rotate(35deg)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.door{border:0;position:relative;min-height:145px;border-radius:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;box-shadow:0 3px 0 #6d5a4b22;transition:transform .2s,box-shadow .2s}.door:hover{transform:translateY(-3px);box-shadow:0 8px 18px #6d5a4b22}.door:focus-visible,.action:focus-visible{outline:3px solid #263c30;outline-offset:4px}.door .num{font-family:Georgia,serif;font-size:1.35rem}.door .motif{font-size:2.1rem;line-height:1}.door .status{font-size:.65rem;letter-spacing:.04em;opacity:.88}.door.locked{filter:saturate(.65)}.door.locked .motif{opacity:.7}.door:nth-child(6n+1){background:#3c513d}.door:nth-child(6n+2){background:#d9c8b4;color:#354636}.door:nth-child(6n+3){background:#a9534b}.door:nth-child(6n+4){background:#c6a281;color:#354636}.door:nth-child(6n+5){background:#bd8175}.door:nth-child(6n+6){background:#939c87;color:#293b2f}.footer{text-align:center;margin-top:25px;color:#72665a;font-size:.84rem}.preview{display:flex;align-items:center;justify-content:center;gap:9px;margin:20px auto 0;font-size:.8rem}.preview input{accent-color:var(--ink);width:17px;height:17px}.veil{position:fixed;inset:0;background:#1b211cc4;display:none;align-items:center;justify-content:center;padding:16px;z-index:4}.veil.open{display:flex}.modal{width:min(100%,580px);max-height:92vh;overflow:auto;background:#faf3eb;border-radius:20px;padding:25px;box-shadow:0 20px 70px #0005;position:relative;text-align:center}.close{position:absolute;right:16px;top:12px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:#354636}.modal h2{font-size:2.8rem;line-height:1;margin:14px 0 20px}.video{background:#d9c7b4;aspect-ratio:16/9;border-radius:14px;display:grid;place-content:center;gap:9px;overflow:hidden}.video .play{font-size:3.3rem;color:#fff}.video span{font-size:.9rem}.video iframe,.video video{width:100%;height:100%;border:0}.video.portrait{aspect-ratio:9/16;max-width:340px;margin-inline:auto}.modal p{line-height:1.6}.action{background:#3c513d;color:white;border:0;padding:11px 23px;border-radius:30px;cursor:pointer;font:inherit;margin-top:10px}@media(max-width:530px){.wrap{padding:28px 14px 40px}.grid{gap:7px}.door{min-height:108px;border-radius:10px;gap:5px}.door .num{font-size:1.08rem}.door .motif{font-size:1.55rem}.door .status{font-size:.55rem}.branch{font-size:36px}.modal{padding:20px}}

/* Neue Türchenansicht nach der Bildvorlage */
.modal{max-width:460px;text-align:left;background:#fbf4ec;padding:22px 22px 26px}
.modal .eyebrow{text-align:center;color:#8b7667;margin:0 30px 16px}
.modal .close{z-index:2}.modal .video{width:100%;aspect-ratio:9/12;max-width:none;margin:0 auto 18px;border-radius:16px;background:#e6d7c9}
.modal .video.portrait{aspect-ratio:9/12;max-width:none}.modal .video iframe{width:100%;height:100%}
.modal h2{font-size:3.2rem;margin:4px 0 15px;color:#27382d;font-weight:600}
.modal h2 .heart{font:1.6rem system-ui;color:#a65148;vertical-align:middle;margin-left:10px}
.description-card{background:#f3e9df;border-radius:18px;padding:18px 19px;line-height:1.65;color:#3c3c35;font-size:.96rem}
.description-card p{margin:0}.tips-heading{font-size:2.1rem;margin:24px 0 10px;color:#354636}
.tips-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.tips-list li{display:flex;gap:12px;align-items:flex-start;line-height:1.5;font-size:.93rem}
.tips-list li::before{content:'♡';font-size:1.4rem;line-height:1;color:#a65148;flex:none}
.modal .action{display:block;margin:25px auto 0}
@media(max-width:530px){.modal{padding:18px 17px 24px}.modal h2{font-size:2.8rem}.tips-heading{font-size:1.9rem}}
</style></head><body><main class="wrap"><div class="branch left" aria-hidden="true">🌲</div><div class="branch right" aria-hidden="true">🌿</div><header><div class="eyebrow">✦ EIN KLEINES STÜCK WEIHNACHTEN ✦</div><h1 class="script">Dein Adventskalender</h1><div class="ornament">♡</div><p>24 Türchen · 24 kleine Überraschungen · ganz viel Vorfreude</p></header><section class="grid" id="calendar" aria-label="24 Adventskalender-Türchen"></section><div class="footer">✧ Jeden Tag öffnet sich ein neues Türchen ✧</div><label class="preview"><input type="checkbox" id="demo"> Vorschau-Modus: alle Türchen testen</label></main><div class="veil" id="veil" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="close" aria-label="Schließen">×</button><div class="eyebrow" id="doorLabel">TÜRCHEN 1</div><div class="video" id="video"><div class="play">▶</div><span>Hier erscheint später dein Video</span></div><h2 class="script" id="modalTitle"></h2><div class="description-card"><p id="description"></p></div><h3 class="script tips-heading" id="tipsHeading">So kannst du sie nutzen:</h3><ul class="tips-list" id="tipsList"></ul><button class="action" id="back">Zurück zum Kalender ♡</button></section></div>
<script>
// ANPASSEN: Trage später für jeden Tag eine YouTube-ID oder eine MP4-Adresse ein.
// Beispiel: 1: { title:'Ein Weihnachtsgruß', youtube:'DEINE_VIDEO_ID', text:'Viel Freude!' }
const INHALTE = {
  1: {
    title: "Bitte",
    youtube: "jJDaQ0HFFSo",
    text: "Diese Gebärde ist ein toller Einstieg, um Kindern zu zeigen, wie sie Wünsche ausdrücken können – und dabei gesehen werden.",
    tips: ["Im Alltag beim Essen oder Spielen", "In der Kita-Gruppe als Ritual", "Mit passenden Materialien zum Ausdrucken"]
  }
};
const JAHR = 2026;
const symbole=['♡','🌿','☆','🌲','✧','♡','❀','🎁','☆','🌲','♡','🌿','🌲','♡','🎁','☆','🌲','✧','♡','🌿','☆','🎁','🌿','♡'];
const calendar=document.getElementById('calendar'),demo=document.getElementById('demo'),veil=document.getElementById('veil'),video=document.getElementById('video');let previousFocus;
function berlinDate(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>Number(parts.find(p=>p.type===k).value);return {year:get('year'),month:get('month'),day:get('day')}}
function available(day){if(demo.checked)return true;const d=berlinDate();return d.year>JAHR||(d.year===JAHR&&d.month===12&&d.day>=day)}
function render(){calendar.replaceChildren();for(let day=1;day<=24;day++){const ok=available(day),b=document.createElement('button');b.type='button';b.className='door'+(ok?'':' locked');b.setAttribute('aria-label',`Türchen ${day}, ${ok?'öffnen':'gesperrt bis zum '+day+'. Dezember'}`);b.innerHTML=`<span class="num">${day}</span><span class="motif" aria-hidden="true">${ok?symbole[day-1]:'♧'}</span><span class="status">${ok?'ÖFFNEN':'🔒 GESPERRT'}</span>`;b.addEventListener('click',()=>ok?openDoor(day):openLocked(day));calendar.append(b)}}
function show(){previousFocus=document.activeElement;veil.classList.add('open');document.getElementById('close').focus();document.body.style.overflow='hidden'}
function setContent(day,item,locked){
  document.getElementById('doorLabel').textContent=`TÜRCHEN ${day}`;
  document.getElementById('modalTitle').innerHTML='';
  document.getElementById('modalTitle').append(document.createTextNode(item.title||`Türchen ${day}`));
  if(!locked){const heart=document.createElement('span');heart.className='heart';heart.textContent='♡';document.getElementById('modalTitle').append(heart)}
  document.getElementById('description').textContent=locked?`Dieses Türchen öffnet sich am ${day}. Dezember ${JAHR}.`:item.text||'Hier steht später ein kurzer Text zur Gebärde und was sie bedeutet.';
  const list=document.getElementById('tipsList');list.replaceChildren();
  document.getElementById('tipsHeading').hidden=locked;list.hidden=locked;
  if(!locked){for(const tip of (item.tips||['Hier kommt der erste Anwendungstipp hin.','Hier kommt ein weiterer Tipp für den Alltag hin.','Hier ist Platz für eine dritte Idee.'])){const li=document.createElement('li');li.textContent=tip;list.append(li)}}
}
function openLocked(day){setContent(day,{},true);video.classList.remove('portrait');video.replaceChildren();const s=document.createElement('span');s.textContent='🔒 Noch ein bisschen Geduld';video.append(s);show()}
function openDoor(day){const item=INHALTE[day]||{};setContent(day,item,false);video.classList.add('portrait');video.replaceChildren();if(item.youtube){const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(item.youtube);iframe.title='Video zu Türchen '+day;iframe.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;video.append(iframe)}else if(item.mp4){const v=document.createElement('video');v.src=item.mp4;v.controls=true;v.playsInline=true;video.append(v)}else{const holder=document.createElement('div');holder.innerHTML='<div class="play">▶</div><span>Platzhalter für dein Video</span>';video.append(holder)}show()}
function close(){veil.classList.remove('open');video.replaceChildren();document.body.style.overflow='';previousFocus?.focus()}
document.getElementById('close').addEventListener('click',close);document.getElementById('back').addEventListener('click',close);veil.addEventListener('click',e=>{if(e.target===veil)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&veil.classList.contains('open'))close()});demo.addEventListener('change',render);render();
</script></body></html>
